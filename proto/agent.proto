syntax = "proto3";

// Shared gRPC contract for the agent-rs platform.
//
// Owner: github.com/cosming20/agent-rs-proto
// Consumers:
//   - github.com/cosming20/agent-rs         (service implementation, tonic server)
//   - github.com/cosming20/agent-rs-web     (leptos+axum frontend, tonic client)
//
// Design (2026-04-21 stateless pivot):
//
//   * Agent-rs is fully stateless about sessions. All conversation history
//     lives in agent-rs-web's Postgres and is replayed to the agent inline
//     with every Ask request. There are no sessions / chat_messages /
//     session_active_documents tables on the agent side.
//
//   * Documents are addressed by their MinIO object key everywhere in this
//     contract (`users/{user_id_simple}/docs/{uuid}.{ext}`). The agent
//     maintains an internal `document_index_state` registry mapping
//     `minio_object_key -> {pending, indexing, complete, failed}`; web polls
//     GetDocumentStatus to hydrate its own `ingested_documents.ingest_status`.
//
//   * Indexing is decoupled from Ask via RabbitMQ. Web uploads bytes
//     directly to MinIO, then calls EnqueueIndex; the IndexerWorker on
//     the agent side consumes the queue and runs Docling + chunking +
//     embed + Qdrant/Neo4j upserts. If Ask arrives before the worker has
//     finished indexing a key referenced in `active_document_keys`, the
//     agent streams AskIndexingWait events until the index is ready, then
//     proceeds with retrieval.
//
// Versioning rules:
//   * Fields must only be ADDED; never renumbered, retyped, or removed.
//   * Reserved numbers: see `reserved` statements in individual messages.
//   * New RPCs append to the `Agent` service.
//   * Breaking changes go into `agent.v2.proto` (not in this release).

package agent.v1;

// -----------------------------------------------------------------------------
// Core value types
// -----------------------------------------------------------------------------

// User identifier — ASCII `[A-Za-z0-9_-]{1,128}`. Validated server-side by
// `agent_rs_core::types::UserId::try_new`; malformed inputs return
// `FAILED_PRECONDITION`.
message UserRef {
  string user_id = 1;
}

// A single turn in a conversation, replayed inline with every Ask request.
// No authorship timestamps — the agent never persists these; they exist
// only for the lifetime of the request that carries them.
message ChatTurn {
  string role    = 1;  // "user" | "assistant"
  string content = 2;
}

// -----------------------------------------------------------------------------
// Ask (query) — server-streaming.
// -----------------------------------------------------------------------------
//
// Flow:
//   1. Client sends AskRequest with history + active/history document keys.
//   2. For each `active_document_keys` entry whose state is not yet
//      `complete`, the server emits AskIndexingWait events while it waits
//      for the IndexerWorker to finish; the event repeats every ~500ms so
//      the UI can keep a spinner alive.
//   3. Once all active keys are indexed, the server runs retrieval over the
//      union `active ∪ history`, runs the multi-turn agent (no streaming
//      during tool calls), then dispatches the dedicated SynthesisAgent
//      whose streamed text-deltas surface as AskPartialAnswer events.
//   4. Terminal event is AskFinal (success) or AskError (fatal). A
//      BudgetSnapshot event is emitted once after Final so clients can
//      render per-request cost without polling a sidechannel.
//
// Clients MUST ignore event variants they don't recognize (forward compat).

message AskRequest {
  string user_id = 1;
  string query   = 2;

  // Prior conversation turns, oldest-first. Empty = fresh conversation.
  repeated ChatTurn history = 3;

  // MinIO keys referenced in the CURRENT turn. These are the ones the
  // agent may need to index on-demand if they're not yet in Qdrant/Neo4j.
  repeated string active_document_keys = 4;

  // MinIO keys previously referenced in this conversation. Retrieval
  // searches the UNION (active ∪ history); the split exists for UX/lineage
  // tracking on the web side, not for retrieval policy.
  repeated string history_document_keys = 5;

  // Optional client-provided correlation UUID for log/trace linking. Has
  // NO authorization meaning — the agent treats it as an opaque string.
  string trace_id = 6;

  // Optional retrieval tuning.
  string strategy = 7;  // "graph_hybrid" (default) | "semantic" | "keyword" | "hybrid" | "graph" | "graph_cot" | "graph_constrained" | "summaries" | "rag_completion" | "temporal"
  uint32 limit    = 8;  // default 8
}

// Stream of events the client renders as they arrive.
message AskEvent {
  oneof payload {
    AskIndexingWait  indexing_wait   = 1;  // repeated while waiting on a not-yet-complete active key
    AskToolCall      tool_call       = 2;  // tool invoked for progress UI
    AskPartialAnswer partial_answer  = 3;  // streaming text chunk (emitted by SynthesisAgent)
    AskFinal         final           = 4;  // terminal success event
    AskError         error           = 5;  // terminal error event
    BudgetSnapshot   budget_snapshot = 6;  // emitted once at end-of-stream after Final
  }
}

message AskIndexingWait {
  string minio_object_key = 1;
  string state            = 2;  // "pending" | "indexing" | "failed"
  string message          = 3;  // optional human-readable hint
}

message AskToolCall {
  string tool_name    = 1;
  string args_summary = 2;  // short human-readable, e.g. 'search_sections(20 ids)'; full args not echoed to client
}

message AskPartialAnswer {
  string text_delta = 1;
}

// Streaming token-budget snapshot, emitted once at end-of-stream so
// clients can render per-request cost without polling a sidechannel.
// Fields mirror `agent_rs_observability::budget::BudgetSnapshot` —
// token/cost totals are the SUM across every LLM call dispatched
// during the request (agent runner + synthesis stream).
message BudgetSnapshot {
  // Sum of prompt + completion tokens across all recorded calls.
  uint64 total_tokens         = 1;
  // Subset of prompt tokens billed at the cached-input rate.
  uint64 cached_input_tokens  = 2;
  // Estimated USD cost across all calls.
  double cost_usd             = 3;
  // Number of LLM calls aggregated.
  uint64 call_count           = 4;
}

message AskFinal {
  // Field 4 (`bool is_grounded`) was removed in the synthesizer-streams
  // refactor: the LLM-based grounding verifier was deleted and the agent
  // no longer emits a per-answer grounded flag. `confidence` (field 3)
  // now carries the deterministic answer-vs-evidence token-overlap
  // signal; downstream consumers should branch on that instead.
  reserved 4;
  reserved "is_grounded";

  string answer                = 1;
  repeated Citation citations  = 2;
  double confidence            = 3;   // 0.0..=1.0 — heuristic answer/evidence token-overlap
  uint32 elapsed_ms            = 5;
  string strategy              = 6;
  optional CoverageReport coverage = 7;  // populated only for list-all / exhaustive flows
}

message Citation {
  uint32 index            = 1;  // 1-based display index
  string chunk_id         = 2;  // stable UUID
  string content_snippet  = 3;
  string minio_object_key = 4;  // which source doc this came from
  string section_path     = 5;  // human-readable, e.g. "5.1.2 / Region growing"
  double score            = 6;
}

message CoverageReport {
  uint32 expected                      = 1;
  uint32 fetched                       = 2;
  repeated string missing_section_ids  = 3;
}

message AskError {
  string code    = 1;  // "invalid_user_id" | "index_failed" | "llm_error" | ...
  string message = 2;  // human-readable
}

// -----------------------------------------------------------------------------
// Indexing control plane
// -----------------------------------------------------------------------------
//
// The web app uploads bytes DIRECTLY to MinIO (via its own S3 credentials),
// then calls EnqueueIndex to hand off the key for chunking + embedding.
// The RPC returns immediately after publishing to RabbitMQ; the actual work
// happens in the IndexerWorker consumer.
//
// To monitor progress, clients poll GetDocumentStatus until state becomes
// `complete` (or `failed` — inspect `error_message`). Ask requests that
// carry not-yet-complete keys in `active_document_keys` will surface the
// same state via AskIndexingWait events.

message EnqueueIndexRequest {
  string user_id          = 1;
  string minio_object_key = 2;
}

message EnqueueIndexResponse {
  string state  = 1;  // "queued" | "already_indexed" | "already_queued"
  string job_id = 2;  // opaque correlation id for logs (may be empty)
}

message GetDocumentStatusRequest {
  string user_id          = 1;
  string minio_object_key = 2;
}

message GetDocumentStatusResponse {
  string state          = 1;  // "pending" | "indexing" | "complete" | "failed" | "not_found"
  string sha256         = 2;  // lowercase hex; empty while state != "complete"
  uint32 n_pages        = 3;
  uint32 n_chunks       = 4;
  string error_message  = 5;  // non-empty only when state == "failed"
}

// -----------------------------------------------------------------------------
// Destructive (saga with idempotent compensations across Qdrant + Neo4j)
// -----------------------------------------------------------------------------
//
// The web app is responsible for removing the MinIO object itself (it
// wrote it; it owns the blob lifecycle). DeleteDocument only purges the
// agent-owned indices and the document_index_state row.

message DeleteDocumentRequest {
  string user_id          = 1;
  string minio_object_key = 2;
}

message DeleteDocumentResponse {
  uint32 removed_chunks   = 1;
  uint32 removed_sections = 2;
}

// -----------------------------------------------------------------------------
// Service
// -----------------------------------------------------------------------------

service Agent {
  // Query path (server-streaming). See AskRequest / AskEvent above.
  rpc Ask(AskRequest) returns (stream AskEvent);

  // Indexing control plane (both RPCs are unary; work happens async on
  // the IndexerWorker consumer of the RabbitMQ queue).
  rpc EnqueueIndex(EnqueueIndexRequest) returns (EnqueueIndexResponse);
  rpc GetDocumentStatus(GetDocumentStatusRequest) returns (GetDocumentStatusResponse);

  // Destructive — purges the agent-owned indices for a document. Web
  // removes the underlying MinIO object separately.
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
}
